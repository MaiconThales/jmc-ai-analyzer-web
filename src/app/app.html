<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<header class="toolbar">
  <a routerLink="/upload" class="brand" aria-label="JMC AI Analyzer, início">
    <img src="logo-mark.svg" alt="" width="32" height="32" />
    <span><strong>JMC AI Analyzer</strong><small>diagnóstico de gravações JFR</small></span>
  </a>
  <div class="tools">
    <span class="api" [class.down]="health() && !health()!.up" role="status">
      <span aria-hidden="true">●</span> {{ health() ? (health()!.up ? 'API ok' : 'API fora do ar') : 'verificando API' }}
    </span>
    <button type="button" class="theme" (click)="theme.cycle()" [attr.aria-label]="themeLabel() + '. Alternar tema'">
      ◐ {{ themeLabel() }}
    </button>
  </div>
</header>
<div class="layout">
  <nav aria-label="Navegação principal">
    <a routerLink="/upload" routerLinkActive="active" ariaCurrentWhenActive="page">⇪ Upload</a>
    <a routerLink="/history" routerLinkActive="active" ariaCurrentWhenActive="page">☰ Histórico</a>
    <a routerLink="/software" routerLinkActive="active" ariaCurrentWhenActive="page">⚙ Softwares</a>
  </nav>
  <main id="conteudo" tabindex="-1">
    @if (warning(); as text) {
      <div class="banner" role="alert">{{ text }}</div>
    }
    <router-outlet />
  </main>
</div>
