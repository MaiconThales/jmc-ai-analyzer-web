server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  # Resolve the Compose service when an API request is made, not during Nginx
  # startup; this keeps the image healthy while Docker brings the backend up.
  set $backend http://backend:8080;
  location /api/ { proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /healthz { default_type text/plain; return 200 'ok'; }
}
